approval_record:
  approved_by: Séverine
  approver_role: Unitalk Operations
  approval_scope: A1 V1 bounded directory scraping and approved public-source research model, including standard bounded Mad Barn access
  equinet_formal_signoff: confirmed_to_unitalk_by_severine_2026-08-19
  approved_rules:
    - The twelve named public directories in this register may be scraped within the approved request-level candidate ceiling and source-specific access conditions.
    - Google Maps may be scraped only through the approved Apify Google Maps Actor and authorised Unitalk account.
    - A1 verifies material retained claims from the prospect's own public business website or another permitted source whenever directory evidence is insufficient.
    - Scraping must stop on terms or robots conflict, access controls, CAPTCHA, login, 403, 429 or unexpected sensitive data; no technical control may be bypassed.
    - No separate per-source candidate cap or per-source daily candidate cap applies; each source may supply up to the remaining discovery target. The total request ceiling, concurrency 1 and all access-stop controls remain mandatory.
    - Public listing data does not create consent or authorise outreach. Twenty Company plus optional linked Person review staging is governed separately by the runtime policy and requires duplicate preflight and read-back reconciliation.

