status_definitions:
  approved: May be used under the stated access profile and restrictions.
  conditional: May be used only under the stated conditions; automation is not implied.
  needs_verification: Do not use as evidence until the missing URL, access, relevance or terms question is resolved.
  blocked: Do not use for A1 prospect discovery.
  unavailable: Named source or page is currently unavailable.

access_profiles:
  public_business_website:
    manual_access: approved
    assisted_page_read: conditional_low_volume
    automated_extraction: blocked_without_site_permission_or_approved_api
    allowed_data:
      - public business identity
      - professional role and business type
      - public business location
      - publicly displayed professional contact details
      - professional services, disciplines and specialisations
      - dated public activity and business claims
    rules:
      - Check the individual site's terms, robots controls and technical restrictions before assisted extraction.
      - Stop if access is blocked, login-gated or rate-limited.
      - Do not bypass CAPTCHAs, paywalls, login controls or technical restrictions.
      - Preserve the page URL, retrieval date and exact evidence excerpt.
  public_directory_manual:
    manual_access: human_seed_selection_only
    assisted_page_read: blocked_without_source_specific_permission
    automated_extraction: blocked_pending_terms_or_approved_api
    allowed_data:
      - human-supplied public listing name
      - human-supplied public profile or business URL
      - human-supplied public location used only to identify the correct business
    rules:
      - A human may use a public directory to select a small seed list when the source permits ordinary public browsing.
      - A1 must not crawl, paginate, bulk-download or automatically extract the directory.
      - A1 must verify retained facts from the prospect's own website or another permitted source.
      - Do not access member-only or login-gated data without an authorised account and approved purpose.
      - Directory content is not retained as high-priority evidence unless source-specific permission is recorded.
  public_directory_bounded_scraping:
    manual_access: approved
    assisted_page_read: approved_low_volume
    automated_extraction: approved_request_bounded_production
    allowed_data:
      - public business or professional listing identity
      - public profile or business URL
      - public business location and service area
      - publicly displayed professional contact details
      - public professional services, disciplines, memberships and specialisations
    rules:
      - Use only the named source URLs recorded as approved in this register.
      - Use the minimum necessary fields and preserve source URL, retrieval timestamp and evidence excerpt.
      - Apply the request-level candidate ceiling and concurrency 1. No separate per-source run or daily candidate cap applies.
      - Stop on terms or robots conflict, CAPTCHA, login, 403, 429, rate limiting or access-control challenge.
      - Do not bypass technical controls, collect private data or infer personal contact details.
      - Treat directory facts as discovery or medium-strength evidence unless the source is authoritative for the specific claim.
      - Verify material ICP claims through the prospect's official website or another permitted source when directory evidence is insufficient, ambiguous or conflicting.
  apify_google_maps_bounded_scraping:
    manual_access: approved
    assisted_page_read: approved_via_apify_actor
    automated_extraction: approved_request_bounded_production_via_authorised_apify_account
    allowed_data:
      - public business name and category
      - public business address, service area and location
      - public business website and phone
      - Google Maps listing URL and place identifier when returned
    rules:
      - Use only the approved Apify Google Maps Actor through the authorised Unitalk account.
      - Apply the request-level candidate ceiling and concurrency 1. No separate per-source run or daily candidate cap applies.
      - Record the Actor, run ID, input, retrieval timestamp, returned source URLs, cost and result count.
      - Minimise retained Google Maps fields and use the business website as the preferred evidence source for material ICP claims.
      - Stop on access, terms, robots, CAPTCHA, rate-limit or unexpected sensitive-data conflict.
      - Do not bypass technical controls, create outreach consent or write to HubSpot.
  blocked_commercial_source:
    manual_access: blocked_for_a1_lead_list
    assisted_page_read: blocked
    automated_extraction: blocked
    allowed_data: []
    rules:
      - Do not use the source to build or enrich an Equinet prospect list.
      - Re-enable only after an official API licence or written permission covers the exact commercial use.
  official_api_pending:
    manual_access: discovery_only
    assisted_page_read: blocked_pending_integration_design
    automated_extraction: official_api_only_after_approval
    allowed_data: []
    rules:
      - Confirm account owner, billing, scopes, attribution, field-use and storage restrictions before activation.
      - Add only the fields explicitly permitted by the approved API design.
      - Test with non-production data and record costs before production use.
  official_registry_manual:
    manual_access: conditional
    assisted_page_read: blocked_pending_terms_review
    automated_extraction: official_api_or_written_permission_only
    allowed_data:
      - publicly searchable registration or membership facts
      - public horse, owner, farm, breeder, competition or affiliate information exposed by the official service
    rules:
      - Use only the fields made public by the official search interface.
      - Do not infer ownership, commercial status or current activity from registration alone.
      - Do not automate without an official API, licence or written permission.
  platform_discovery_only:
    manual_access: conditional
    assisted_page_read: blocked_without_platform_permission
    automated_extraction: official_api_or_written_permission_only
    allowed_data:
      - discovery of a public business or professional profile
      - profile URL
      - manually observed public business facts when permitted
    rules:
      - Never use unauthorised scraping, browser extensions, bots or account automation.
      - Prefer the prospect's own website or an official directory as retained evidence.
      - Do not treat a search result snippet or platform recommendation as authoritative evidence.
  search_index_discovery_only:
    manual_access: approved
    assisted_page_read: approved_search_tool_only
    automated_extraction: approved_search_api_only
    allowed_data:
      - discovery query results
      - destination URLs
    rules:
      - A search result is a discovery aid, not the final evidence source.
      - Open and cite the destination page that supports each retained fact.
      - Do not scrape search result pages directly.
  internal_authoritative:
    manual_access: authorised_users_only
    assisted_page_read: approved_connector_only
    automated_extraction: approved_read_only_connector_only
    allowed_data:
      - records and exclusions within the user's source-system permissions
    rules:
      - Source-system permissions remain authoritative.
      - A1 must not claim a check passed when the connection is unavailable.
      - Writes require a separate authorised action and are outside this register.
  client_authorised_file:
    manual_access: conditional
    assisted_page_read: conditional
    automated_extraction: conditional
    allowed_data:
      - data explicitly supplied or approved by Equinet for A1
    rules:
      - Record file owner, purpose, date, access boundary and permitted reuse.
      - Do not reuse a file outside its approved purpose.
  unavailable_no_licence:
    manual_access: unavailable
    assisted_page_read: unavailable
    automated_extraction: unavailable
    allowed_data: []
    rules:
      - Do not use until an account, licence, data rights and approved access method are confirmed.

