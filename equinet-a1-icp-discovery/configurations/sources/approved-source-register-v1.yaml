    Equinet confirmed these named sources for bounded A1 scraping through Unitalk on 17 August 2026.
    Approval remains subject to current source terms, robots controls, technical access restrictions, privacy rules
    and the authorised Unitalk or Apify account scope.
  default_limits_after_approval:
    max_candidates_per_source_per_run: null
    max_candidates_per_source_per_day: null
    source_request_limit: remaining_discovery_target
    maximum_total_requested_candidates: 200
    concurrency_per_source: 1
  discovery_priority:
    farrier:
      - pdf.mad_barn_directory
      - integration.apify_google_maps_scraper
