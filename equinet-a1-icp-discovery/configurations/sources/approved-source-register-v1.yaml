shared_evidence_rules:
  search_results_are_discovery_only: true
  confirmed_fact_requires_destination_source: true
  low_or_medium_directory_evidence_requires_corroboration_for:
    - horse count
    - client base size
    - purchasing influence
    - active customer status
    - high-priority classification
  public_professional_contacts_may_be_retained: true
  personal_or_private_contact_inference_prohibited: true
  no_outreach_authorisation_created_by_publication: true
  access_control_bypass_prohibited: true
  tracking_parameters_to_remove:
    - utm_source
    - utm_medium
    - utm_campaign
    - utm_term
    - utm_content
  review_frequency_days: 90

