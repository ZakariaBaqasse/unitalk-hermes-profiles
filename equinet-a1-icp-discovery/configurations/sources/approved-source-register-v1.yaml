      - pdf.horseprofinder
    source_request_limit: remaining_discovery_target
    stop_when: globally_new_leads_reach_discovery_target
    note: Mad Barn is not currently enabled by its adapter for horse_owner runs.
  stop_immediately_on:
    - HTTP 403
    - HTTP 429
    - CAPTCHA or bot challenge
    - login or paywall requirement
